<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Regis Logo.PNG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Regis Partners — Philippine institutional brokerage, research, and capital markets advisory since 1999." />
    <title>Regis Partners — Philippine Institutional Brokerage & Capital Markets</title>
    <script>
      // Paint the saved theme before the bundle loads so the signed-in areas
      // (CMS, CRMS, Client Portal) never flash light on reload. Mirrors
      // src/lib/theme.tsx — keep the key and the route test in step.
      (function () {
        try {
          var p = location.pathname;
          if (!/^\/(cms|crms)(\/|$)|^\/portal\/?$/.test(p)) return;
          var pref = localStorage.getItem("regis-theme");
          var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
